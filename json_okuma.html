<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osmaniye Namaz Vakitleri</title>
    
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f4f8; padding: 20px; }
        h1 { text-align: center; color: #333; margin-bottom: 30px; }
        #dataTable { 
            border-collapse: collapse; width: 100%; max-width: 800px; 
            margin: 20px auto; background-color: #ffffff; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        #dataTable tr:first-child { background-color: #00ADB5; color: white; font-weight: bold; }
        #dataTable td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        #dataTable tr:nth-child(even):not(:first-child) { background-color: #f7f7f7; }
        #dataTable tr:hover:not(:first-child) { background-color: #e6f7ff; }
        .error-message { color: red; font-weight: bold; margin-top: 20px; text-align: center; }
        .loading-message { color: #555; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Osmaniye Namaz Vakitleri</h1>
    
    <div id="status-message" class="loading-message">Vakitler yükleniyor...</div>

    <table id="dataTable">
        <tr>
            <td>Tarih</td>
            <td>İmsak</td>
            <td>Güneş</td>
            <td>Öğle</td>
            <td>İkindi</td>
            <td>Akşam</td>
            <td>Yatsı</td>
        </tr>
    </table>

    <script>
        const dataTable = document.getElementById("dataTable");
        const statusMessage = document.getElementById("status-message");
        const API_URL = "https://ezanvakti.emushaf.net/vakitler/9788"; 

        fetch(API_URL)
        .then(response => {
            // Hata yoksa devam et
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }
            return response.json();
        })
        .then(jsonData => {
            // Başarılı yüklemede mesajı kaldır
            statusMessage.style.display = 'none';

            // Veriyi tabloya ekle
            jsonData.forEach(data => {
                let tr = document.createElement("tr");
                
                // data.Aksam doğru JSON anahtarıdır.
                tr.innerHTML = `
                    <td>${data.MiladiTarihKisa}</td>
                    <td>${data.Imsak}</td>
                    <td>${data.Gunes}</td>
                    <td>${data.Ogle}</td>
                    <td>${data.Ikindi}</td>
                    <td>${data.Aksam}</td> 
                    <td>${data.Yatsi}</td>
                `;
                dataTable.insertAdjacentElement("beforeend", tr);
            });
        })
        .catch(error => {
            // Hata yakalama
            statusMessage.className = 'error-message';
            
            // Kodun yerelde düzgün çalışmamasının nedenini açıklayan nihai mesaj:
            const displayError = "Vakitler yüklenemedi. Kod, API isteği sırasında tarayıcı tarafından engellendi. Bu sorunu çözmek için dosyayı bir HTTPS sunucudan (GitHub Pages) açmanız GEREKİR.";

            statusMessage.textContent = displayError;
            statusMessage.style.display = 'block';
            console.error("Fetch hatası:", error);
        });
    </script>
</body>
</html>
